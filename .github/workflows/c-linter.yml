name: cpp-linter

# Static analysis (clang-tidy + cppcheck) via the AMReX cpp-linter action. Builds Emu
# so clang-tidy has a real compilation database, then uploads the reports as artifacts.
# Runs on every push to a branch and on every pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel an in-progress (compile-heavy) run when newer commits arrive on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get submodules
        run: |
          git submodule update --init

      # Exec/GNUmakefile is not committed (it is copied from makefiles/ before every
      # build), so the linter's `make` has nothing to run until we provide one. The
      # default `make` target chains code-generation then the build (Make.Emu).
      - name: Provide a build makefile
        run: cp makefiles/GNUmakefile_default Exec/GNUmakefile

      - name: Run cpp linter
        uses: AMReX-Astro/cpp-linter-action@main
        with:
          build_path: 'Exec'
          make_options: '-j 2 USE_OMP=FALSE USE_MPI=FALSE USE_CUDA=FALSE USE_HDF5=FALSE DIM=3 DEBUG=TRUE'
          ignore_files: 'amrex'
          header_filter: 'Emu'
          checks: 'bugprone-*,performance-*,portability-*,modernize-*,clang-analyzer-*,cppcoreguidelines-*,readability-*,-cppcoreguidelines-pro-bounds-pointer-arithmetic,-cppcoreguidelines-pro-bounds-constant-array-index,-clang-diagnostic-unknown-warning-option,-clang-diagnostic-unknown-pragmas,-readability-avoid-const-params-in-decls,-cppcoreguidelines-owning-memory'

      - name: Archive clang tidy report
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt

      - name: Archive cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
